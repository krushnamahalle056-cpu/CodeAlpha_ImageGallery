<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Gallery | CodeAlpha</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>My Image Gallery</h1>
        <p>Explore beautiful moments</p>
    </header>


    <!-- Filter Buttons -->
    <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="city">City</button>
        <button class="filter-btn" data-filter="animals">Animals</button>
    </div>


    <!-- Gallery -->
    <main class="gallery">

        <div class="gallery-item" data-category="nature">
            <img
                src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80"
                alt="Nature">
            <div class="caption">Beautiful Nature</div>
        </div>

        <div class="gallery-item" data-category="city">
            <img
                src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=800&q=80"
                alt="City">
            <div class="caption">City View</div>
        </div>

        <div class="gallery-item" data-category="animals">
            <img
                src="https://images.unsplash.com/photo-1549366021-9f761d450615?auto=format&fit=crop&w=800&q=80"
                alt="Animal">
            <div class="caption">Wild Animal</div>
        </div>

        <div class="gallery-item" data-category="nature">
            <img
                src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80"
                alt="Mountain">
            <div class="caption">Mountain</div>
        </div>

        <div class="gallery-item" data-category="city">
            <img
                src="https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=800&q=80"
                alt="City Night">
            <div class="caption">City Lights</div>
        </div>

        <div class="gallery-item" data-category="animals">
            <img
                src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=800&q=80"
                alt="Dog">
            <div class="caption">Cute Dog</div>
        </div>

        <div class="gallery-item" data-category="nature">
            <img
                src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80"
                alt="Forest">
            <div class="caption">Green Forest</div>
        </div>

        <div class="gallery-item" data-category="city">
            <img
                src="https://images.unsplash.com/photo-1444723121867-7a241cacace9?auto=format&fit=crop&w=800&q=80"
                alt="Buildings">
            <div class="caption">Modern City</div>
        </div>

        <div class="gallery-item" data-category="animals">
            <img
                src="https://images.unsplash.com/photo-1474511320723-9a56873867b5?auto=format&fit=crop&w=800&q=80"
                alt="Fox">
            <div class="caption">Wildlife</div>
        </div>

    </main>

    <!-- Lightbox -->
     
    <div class="lightbox" id="lightbox">

        <button class="close" id="close">&times;</button>

        <button class="prev" id="prev">&#10094;</button>

        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Gallery Image">
            <p id="lightbox-caption"></p>
        </div>

        <button class="next" id="next">&#10095;</button>

    </div>


    <footer>
        <p>© 2026 My Image Gallery </p>
    </footer>


    <script src="script.js"></script>

    

</body>
</html>
